<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 页面走丢了</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f6f4f0;
      --surface: #ffffff;
      --accent: #4a7c59;
      --text-primary: #1a1a17;
      --text-body: #4a4a45;
      --text-muted: #8a8a82;
      --border: #e2dfd8;
      --radius: 14px;
      --shadow-md: 0 4px 20px rgba(26,26,23,0.06), 0 1px 3px rgba(26,26,23,0.04);
    }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: 'DM Sans', 'Noto Serif SC', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    h1, h2, h3 { font-family: 'Instrument Serif', 'Noto Serif SC', Georgia, serif; color: var(--text-primary); font-weight: 400; }

    .page-404 {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .page-404-inner {
      max-width: 520px;
    }

    .error-code {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(100px, 15vw, 180px);
      color: var(--accent);
      opacity: 0.15;
      line-height: 1;
      letter-spacing: -8px;
      user-select: none;
      margin-bottom: -20px;
      position: relative;
    }

    .error-code::after {
      content: '';
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 2px;
      background: var(--accent);
      opacity: 0.3;
    }

    .error-title {
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .error-desc {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      font-family: inherit;
    }

    .btn-primary {
      background: var(--text-primary);
      color: #fff;
      box-shadow: 0 2px 12px rgba(26, 26, 23, 0.15);
    }

    .btn-primary:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(74, 124, 89, 0.25);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--text-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .footer-simple {
      padding: 24px 0;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer-simple p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-simple a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-simple a:hover {
      color: var(--text-primary);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <main class="page-404">
    <div class="page-404-inner">
      <div class="error-code">404</div>
      <h1 class="error-title">页面走丢了</h1>
      <p class="error-desc">你要找的页面不存在，可能已经被移除或者地址输错了。<br>但没关系，迷路也是探索的一部分。</p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">回到首页</a>
        <a href="https://mouy.site" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">去博客看看</a>
      </div>
    </div>
  </main>

  <footer class="footer-simple">
    <p>&copy; 2026 <a href="/">某炜</a> — 以好奇心构建，以用心交付。</p>
  </footer>

</body>
</html>
